<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Hover Button Effects</h1>
<button class="btn fill-in">
    FILL In
</button>
<button class="btn fill-up">
    FILL UP
</button>
<button class="btn slide">
    slide
</button>
<button class="btn notify"> 
    <span class="default-text">
        Notify Me
    </span>
   <span class="hover-text">                                  
Thanks
   </span>
</button>
<button class="btn offset">
Offset
</button>
<button class="btn glowing">GLOWING</button>
<button class="btn raise">RAISE</button>
<button class="btn close"> CLOSE</button>
<button class="btn hover-me" data-text="HOVER ME"> HOVER ME</button>
<button class="btn zoom"> ZOOM </button>  
<button class="btn explore">Explore More</button>
<button class="btn fancy">Fancy Button</button>
<button class="btn hover-round">Hover Me</button>
<button class="btn angled-simple">
  <span class="left"></span>
  <span class="right"></span>
  Explore More
</button>
</div>

</body>

</html>
