<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/resert.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<section class="hero">   
<div class="container">
<header class="header">
    <img src="img/netflix-logo-png-2562 1.png" alt="neflix">
       <div class="separator"></div>
    <span class="date-picker">
Friday July 8th
    </span>
    <form class="search-wrapper" action="#" method="get">
      <div class="search-box"></div>
      <input type="text" placeholder="Search..." name="q" class="search-input">
      <button type="submit" class="search-button">
   <i class="fas fa-search"></i>
      </button>
    </form>
    <img src="img/Ellipse 2.png" alt="User Avatar" class="avatar">
</header>

<section class="description">
  <div class="genres">
    <span>Drama</span>
    <div class="divider"></div>
    <span>Thriller</span>
    <div class="divider"></div>
    <span>Supernatural</span>
  </div>

  <h1 class="title">Stranger Things</h1>

  <div class="info">
    <span>2019</span>
    <div class="divider"></div>
    <span>DIRECTOR: Shawn Levy</span>
    <div class="divider"></div>
    <span>Seasons: 3 (5 Episodes)</span>
  </div>

  <p class="description-text">
    A chilling supernatural thriller set in a small town where a group of kids uncover dark government secrets and face terrifying creatures from another dimension.
  </p>

  <div class="rating">
    <i class="fas fa-star"></i>
    <i class="fas fa-star"></i>
    <i class="fas fa-star"></i>
    <i class="far fa-star"></i>
    <i class="far fa-star"></i>
  </div>

  <div class="buttons">
    <button class="stream-now">
       STREAM NOW
     <i class="fas fa-play"></i>
    </button>
    <button class="all-episodes">
      ALL EPISODES
    </button>
  </div>
</section>
<section class="bottom-section">
  <div class="bottom-header">
    <h2>POPULAR THIS WEEK</h2>
    <div class="nav-buttons">
      <button>&lt;</button>
      <button>&gt;</button>
    </div>
  </div>

  <div class="image-row">
    <img src="img/Rectangle 1.png" alt="">
    <img src="img/Rectangle 7.png" alt="">
    <img src="img/Rectangle 8.png" alt="">
    <img src="img/Rectangle 9.png" alt="">
    <img src="img/Rectangle 11.png" alt="">
  </div>

  <div class="age-box">
    <div class="bar"></div>
    <div class="age-text">16+</div>
  </div>
</section>
</div>
</section>
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>    
    </body>
</html>
