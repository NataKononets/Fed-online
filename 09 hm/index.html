<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/reset.css">
    <link rel="stylesheet" href="style/style.css">    

</head>
<body>
    <main>
        <h1>
            <strong>

        <div class="card-row clearfix">
            <div class="user-card">
                <div class="user-photo">

                <h4>
                    Dan Burykin
                </h4>

                    Vue.JS Developer
                </p>
                <div class="skills">
                    <div class="slill-item vue">
                        <img src="img/V.png" alt="logo">
                    </div>
                </div>
            </div>
            <div class="user-card">
                <div class="user-photo">
                    <img src="img/Avatar1.png" alt="EsiDoda"></div>
                <h4>
                    Esi Doda
                </h4>
                <p>
                    Software Developer
                </p>
                <div class="skills">
                    <div class="slill-item angular">
                        <img src="img/Just6.png" alt="logo">
                    </div>
                    <div class="slill-item flutter">
                        <img src="img/Just5.png" alt="logo">
                    </div>
                    <div class="slill-item reagtJS">

                </div>
            </div>
            <div class="user-card">

                   Alex Harper
                </h4>

                   RN Executive
                </p>
                <div class="skills">
                    <div class="slill-item JAVA">
                        <img src="img/Just4.png" alt="logo">
                    </div>
                    <div class="slill-item Native">
                        <img src="img/Just3.png" alt="logo">
                    </div>
                </div>
            </div>
            <div class="user-card">
                <div class="user-photo"><img src="img/Avatar.png" alt="user"></div>
                <h4>
                   Amarna Miller 
                </h4>
                <p>
                 Frontend Wizard
                </p>
                <div class="skills">
                    <div class="slill-item HTML">
                        <img src="img/Just2.png" alt="logo">
                    </div>
                    <div class="slill-item css">
                        <img src="img/Just Logo.png" alt="logo">
                    </div>
                </div>
            </div>
            
        </div>
