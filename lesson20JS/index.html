<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="main.js"></script>
    <style>
      #task4 .pomodoro-card {
        background: #1e1e1e;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35),
          inset 0 0 0 1px rgba(255, 255, 255, 0.6);
        width: 320px;
        padding: 24px 20px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      #task4 .ring {
        width: 240px;
        height: 240px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #111;
        box-shadow: 0 0 0 12px #ff9800, 0 0 0 1px rgba(255, 255, 255, 0.8);
      }
      #task4 .time {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
          sans-serif;
        font-size: 44px;
        color: #fff;
        font-weight: 800;
        letter-spacing: 1px;
      }
      #task4 .controls {
        display: flex;
        gap: 16px;
      }
      #task4 .btn {
        background: #ff9300;
        border: none;
        border-radius: 12px;
        color: #111;
        font-size: 20px;
        font-weight: 800;
        padding: 10px 20px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease background 0.2s,
          color 0.2s ease;
      }
      #task4 .btn-start {
        background: #ff9300;
        color: #111;
        box-shadow: 0 4px 0 #cc8f00;
      }
      #task4 .btn-start:active {
        transform: translateY(1px);
        box-shadow: 0 2px 0 #cc8f00;
      }
      #task4 .btn-reset {
        background: #1e1e1e;
        color: #fff;
        outline: 1.5px solid #fff;
        outline-offset: -1px;
      }
      #task4 .btn-reset:hover {
        background: #2a2a2a;
      }
    </style>
  </head>
  <body>
    <button id="startBtn">start taimer</button>
    <p id="counter">0</p>

    <section id="task3" style="margin-top: 50px; text-align: center">
      <h2>Change bacground color</h2>
      <button id="colorBTN3">Change color</button>
      <p id="colorInfo3"></p>
    </section>
    <section
      id="task4"
      style="display: grid; place-items: center; margin-top: 40px"
    >
    
      <div class="pomodoro-card">
        <div class="ring">
          <div id="timerDisplay4" class="time">25:00</div>
        </div>
        <div class="controls">
          <button id="startBtn4" class="btn btn-start">Start</button>
          <button id="resetBtn4" class="btn btn-reset">Reset</button>
        </div>
      </div>
    </section>
  </body>
</html>
